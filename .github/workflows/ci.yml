name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:  # run by release.yml before publishing

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2  # setup-uv has no floating major tags
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked pytest

  lowest:
    name: Python 3.10, lowest dependency versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2  # setup-uv has no floating major tags
        with:
          python-version: "3.10"
      # Every direct dependency at the oldest version pyproject.toml allows, so
      # the minimums stay honest. pytest itself is installed normally.
      - run: uv venv
      - run: uv pip install --resolution lowest-direct .
      - run: uv pip install pytest
      - run: .venv/bin/python -m pytest
